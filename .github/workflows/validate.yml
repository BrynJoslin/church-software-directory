name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Astro and content
        run: npm run check

      - name: Check stale listings
        run: npm run check:stale

      - name: Check verdict quality
        run: npm run check:phase4

      - name: Check recorded source health
        run: npm run check:links

      - name: Test interaction states
        run: npm run test:interactions

      - name: Build production site
        run: npm run build

      - name: Verify sitemap coverage
        run: npm run check:sitemap
