<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="50%" style="stop-color:#c9952c"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Donation box / slot - back layer -->
  <rect x="40" y="105" width="120" height="40" rx="10" ry="10" fill="#3a7d8c"/>

  <!-- Slot opening (white inset) -->
  <rect x="50" y="112" width="100" height="26" rx="8" ry="8" fill="white"/>

  <!-- Inner slot dark area -->
  <rect x="58" y="118" width="84" height="14" rx="5" ry="5" fill="#3a7d8c"/>

  <!-- Heart shape -->
  <path d="M100 130
           C100 130, 60 95, 60 75
           C60 60, 72 50, 82 50
           C90 50, 96 56, 100 63
           C104 56, 110 50, 118 50
           C128 50, 140 60, 140 75
           C140 95, 100 130, 100 130Z"
        fill="url(#goldGradient)"/>

  <!-- Motion lines - left (outer, higher) -->
  <path d="M43 78 C39 68, 43 58, 51 52" stroke="#c9952c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Motion lines - left (inner, lower) -->
  <path d="M53 78 C50 70, 53 62, 60 57" stroke="#c9952c" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Motion lines - right (outer, higher) -->
  <path d="M157 78 C161 68, 157 58, 149 52" stroke="#c9952c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Motion lines - right (inner, lower) -->
  <path d="M147 78 C150 70, 147 62, 140 57" stroke="#c9952c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
